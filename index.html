<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fredy Alvarez | Full Stack Developer Jr</title>

    <link rel="stylesheet" href="css/index.css" />

    <meta name="description"
        content="Portafolio de Fredy Alvarez, Full Stack Developer Junior. Proyectos en React, Node.js, MongoDB y APIs REST.">

    <meta name="author" content="Fredy Alvarez">
</head>

<body>

    <!-- Nav -->

    <nav class="nav">

        <div class="nav__logo">FA</div>

        <!-- Botón hamburguesa -->
        <button
            class="nav__toggle"
            id="navToggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="navMenu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Menú -->
        <div class="nav__menu" id="navMenu">

            <ul class="nav__links" id="navLinks">
                <li>
                    <a href="#home" data-i18n="nav.home"></a>
                </li>

                <li>
                    <a href="#projects" data-i18n="nav.projects"></a>
                </li>

                <li>
                    <a href="#skills" data-i18n="nav.skills"></a>
                </li>

                <li>
                    <a href="#about" data-i18n="nav.about"></a>
                </li>

                <li>
                    <a href="#contact" data-i18n="nav.contact"></a>
                </li>
            </ul>

            <!-- Selector de idioma -->
            <div class="lang-toggle">
                <button
                    class="lang-btn"
                    data-lang="es"
                    type="button"
                >
                    ES
                </button>

                <button
                    class="lang-btn"
                    data-lang="en"
                    type="button"
                >
                    EN
                </button>
            </div>

        </div>

    </nav>


    <!-- Header -->

    <header id="home" class="intro">

        <h1>Fredy Alvarez</h1>

        <h2>Full Stack Developer Junior</h2>

        <p data-i18n="header.subtitle"></p>

        <p data-i18n="header.description"></p>

        <a
            href="https://github.com/fredyalvarezz"
            target="_blank"
            rel="noopener noreferrer"
            class="badge-available"
        >
            <span class="badge-dot"></span>

            <span data-i18n="header.badge"></span>
        </a>

        <div class="intro-actions">

            <a
                href="assets/cv/Fredy_Alvarez_CV.pdf"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-cv"
            >
                <img
                    src="assets/icons/file.svg"
                    alt="CV icon"
                >

                CV
            </a>

        </div>

        <div class="intro-actions">

            <a
                href="assets/cv/Fredy_Alvarez_CV-ENG.pdf"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-cv"
            >
                <img
                    src="assets/icons/file.svg"
                    alt="CV icon"
                >

                CV - ENG
            </a>

        </div>

    </header>


    <!-- Proyectos -->

    <section id="projects" class="section">

        <h3 data-i18n="projects.title"></h3>

        <p
            class="section-intro"
            data-i18n="projects.intro"
        ></p>

        <div
            class="featured-projects"
            id="featuredProjects"
        >
        </div>


        <div class="more-projects-toggle">

            <button
                id="toggleProjectsBtn"
                class="btn-toggle"
                aria-expanded="false"
                aria-controls="otherProjectsWrapper"
            >
            </button>

        </div>


        <div
            class="other-projects hidden"
            id="otherProjectsWrapper"
        >

            <div
                class="projects"
                id="otherProjects"
            >
            </div>

        </div>

    </section>


    <!-- About -->

    <section
        id="about"
        class="section about"
    >

        <h3 data-i18n="about.title"></h3>

        <div class="about-content">

            <div class="about-photo">

                <img
                    src="assets/img/me.png"
                    alt="Foto de Fredy Alvarez"
                >

            </div>


            <div class="about-text">

                <p data-i18n="about.p1"></p>

                <p data-i18n="about.p2"></p>

                <p data-i18n="about.p3"></p>

            </div>

        </div>

    </section>


    <!-- Skills-->

    <section
        id="skills"
        class="section"
    >

        <h3 data-i18n="skills.title"></h3>

        <div class="skills">

            <div class="skill">
                <img
                    src="assets/icons/html.png"
                    alt="HTML5"
                >
                <span>HTML5</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/css.png"
                    alt="CSS3"
                >
                <span>CSS3</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/javascript.png"
                    alt="JavaScript"
                >
                <span>JavaScript</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/react.png"
                    alt="React"
                >
                <span>React</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/github.png"
                    alt="Git"
                >
                <span>Git / GitHub</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/api.png"
                    alt="APIs REST"
                >
                <span>APIs REST</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/MongoDB.png"
                    alt="MongoDB"
                >
                <span>MongoDB</span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/support.png"
                    alt="Soporte Técnico"
                >
                <span data-i18n="skills.support"></span>
            </div>

            <div class="skill">
                <img
                    src="assets/icons/network.png"
                    alt="Redes"
                >
                <span data-i18n="skills.network"></span>
            </div>

        </div>

    </section>


    <!-- Contact -->

    <section
        id="contact"
        class="section"
    >

        <h3 data-i18n="contact.title"></h3>

        <p>
            Email:
            <a href="mailto:fredyalvarez64@gmail.com">
                fredyalvarez64@gmail.com
            </a>
        </p>

        <p>

            <a
                href="https://github.com/fredyalvarezz"
                target="_blank"
                rel="noopener noreferrer"
            >
                GitHub
            </a>

            <a
                href="https://www.linkedin.com/in/fredyalvarezleyva/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

        </p>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>
            © <span id="year"></span> Fredy Alvarez
        </p>

    </footer>


    <!-- Modal -->

    <div
        class="modal"
        id="projectModal"
    >

        <div class="modal-content">

            <span
                class="modal-close"
                role="button"
                tabindex="0"
                aria-label="Cerrar"
            >
                &times;
            </span>

            <div class="modal-body">

                <div class="modal-info">

                    <h3 id="modal-title"></h3>

                    <p id="modal-problem"></p>

                    <p id="modal-solution"></p>

                    <ul id="modal-features"></ul>

                    <p id="modal-result"></p>

                    <p id="modal-tech"></p>

                    <div id="modal-links"></div>

                </div>


                <div
                    class="modal-images"
                    id="modal-images"
                >
                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript-->
    <script src="js/main.js"></script>

</body>

</html>
